[package]
name = "rust-c-udp"
version = "0.1.0"
edition = "2021"
description = "Node.js dgram (UDP) implementation for React Native"

[lib]
name = "rust_c_udp"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
libc = "0.2"
once_cell = "1.18"
log = "0.4"
bytes = "1.5"
lazy_static = "1.4"
env_logger = "0.10"
socket2 = { version = "0.5", features = ["all"] }
dashmap = "5.5"

[build-dependencies]
cbindgen = "0.26"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
